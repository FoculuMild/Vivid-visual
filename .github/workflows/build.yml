name: Build Vivid Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Unzip and Build
      run: |
        unzip -o *.zip
        # Ищем папку, где лежит build.gradle, и переходим в нее
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/\.*" | head -n 1 | xargs dirname)
        cd "$PROJECT_DIR"
        gradle build
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vivid-Mod
        path: '**/build/libs/*.jar'
